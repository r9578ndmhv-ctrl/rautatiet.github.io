<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDUSTRY INTELLIGENCE MONITOR</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f0f2f5; --s1:#fff; --s2:#f7f8fa; --border:#dde3ec;
  --text:#1a2235; --muted:#6b7a94; --dim:#b0bac8;
  --forest:#1a7a40; --metal:#1560a0; --other:#7c3aed;
  --up:#16a34a; --down:#dc2626; --flat:#9ca3af;
  --sh:0 1px 6px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;}

/* ── HEADER ── */
#hdr{background:#fff;border-bottom:1px solid var(--border);box-shadow:var(--sh);position:sticky;top:0;z-index:100;}
.hdr-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:0 20px;height:52px;}
.brand{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:4px;background:linear-gradient(135deg,#c08000,#1560a0,#1a7a40);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.brand-sub{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2px;margin-top:1px;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-shrink:0;}
.clock{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
.live-chip{display:flex;align-items:center;gap:5px;background:#f0fdf4;border:1px solid #bbf7d0;padding:3px 10px;border-radius:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--up);}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--up);animation:bl 2s infinite;}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
.next-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);}
#refresh-btn{padding:5px 14px;background:var(--text);color:#fff;border:none;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;cursor:pointer;letter-spacing:1px;transition:opacity .2s;}
#refresh-btn:hover{opacity:.8;}

/* ── STOCK STRIP ── */
#stock-strip{background:#fff;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;}
#stock-strip::-webkit-scrollbar{display:none;}
.si{flex-shrink:0;padding:6px 16px;border-right:1px solid var(--border);min-width:110px;}
.si-sym{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;}
.si-name{font-size:10px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px;}
.si-price{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text);}
.si-chg{font-family:'IBM Plex Mono',monospace;font-size:10px;}
.si-chg.up{color:var(--up);}.si-chg.down{color:var(--down);}.si-chg.flat{color:var(--flat);}

/* ── TICKER ── */
#ticker{background:var(--text);height:28px;display:flex;align-items:center;overflow:hidden;}
.ticker-tag{flex-shrink:0;background:#c08000;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;padding:0 10px;height:100%;display:flex;align-items:center;}
.ticker-scroll{flex:1;overflow:hidden;}
.ticker-inner{display:inline-block;white-space:nowrap;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9ca3af;animation:scroll-t 90s linear infinite;padding-left:100%;}
@keyframes scroll-t{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* ── COLUMNS ── */
#columns{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px 20px;}
@media(max-width:900px){#columns{grid-template-columns:1fr;}}

.col{display:flex;flex-direction:column;gap:0;}
.col-header{position:sticky;top:52px;z-index:50;background:var(--s2);border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.col-stripe{height:3px;width:32px;border-radius:2px;flex-shrink:0;}
.col-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;}
.col-count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);background:var(--border);padding:2px 7px;border-radius:10px;margin-left:auto;}
.col-status{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);}
.si-dot2{width:5px;height:5px;border-radius:50%;background:var(--dim);flex-shrink:0;}
.si-dot2.ok{background:var(--up);}.si-dot2.busy{background:#c08000;animation:bl .5s infinite;}.si-dot2.err{background:var(--down);}

.col-body{border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:var(--s2);flex:1;display:flex;flex-direction:column;gap:1px;padding:4px;max-height:calc(100vh - 200px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.col-body::-webkit-scrollbar{width:4px;}
.col-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ── NEWS CARD ── */
.nc{background:var(--s1);border:1px solid var(--border);border-radius:6px;padding:14px;cursor:pointer;transition:all .15s;animation:fu .3s ease both;position:relative;overflow:hidden;}
.nc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.nc[data-col="forest"]::before{background:var(--forest);}
.nc[data-col="metal"]::before {background:var(--metal);}
.nc[data-col="other"]::before {background:var(--other);}
.nc:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.1);border-color:var(--dim);}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.nc-top{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.nc-src{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.5px;padding:2px 7px;border-radius:3px;font-weight:600;}
.nc-src[data-col="forest"]{background:#dcfce7;color:var(--forest);}
.nc-src[data-col="metal"] {background:#dbeafe;color:var(--metal);}
.nc-src[data-col="other"] {background:#ede9fe;color:var(--other);}
.nc-date{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-left:auto;}
.nc-title{font-weight:600;font-size:13px;line-height:1.45;color:var(--text);margin-bottom:6px;}
.nc-desc{font-size:11px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* ── SKELETON ── */
.skel{background:var(--s1);border:1px solid var(--border);border-radius:6px;padding:14px;}
.skel-l{background:var(--border);border-radius:3px;margin-bottom:7px;animation:sh 1.4s infinite;}
@keyframes sh{0%,100%{opacity:.5}50%{opacity:1}}

/* ── COMPANY FILTER ── */
.col-filter{border:1px solid var(--border);border-top:none;background:#fff;padding:8px 10px;display:flex;flex-wrap:wrap;gap:5px;}
.cf{padding:3px 10px;border-radius:12px;border:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);cursor:pointer;background:#fff;transition:all .15s;white-space:nowrap;}
.cf:hover{border-color:var(--dim);color:var(--text);}
.cf.active[data-col="forest"]{color:var(--forest);background:#f0fdf4;border-color:var(--forest);}
.cf.active[data-col="metal"] {color:var(--metal); background:#eff6ff;border-color:var(--metal);}
.cf.active[data-col="other"] {color:var(--other); background:#faf5ff;border-color:var(--other);}
</style>
</head>
<body>

<div id="hdr">
  <div class="hdr-inner">
    <div><div class="brand">INDUSTRY INTELLIGENCE</div><div class="brand-sub">RSS · AUTO-REFRESH · EI API-AVAINTA</div></div>
    <div class="hdr-right">
      <div class="live-chip"><div class="ldot"></div>LIVE</div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="next-lbl" id="next-lbl">⟳ --:--</div>
      <button id="refresh-btn" onclick="fetchAll()">⟳ PÄIVITÄ</button>
    </div>
  </div>
  <div id="stock-strip"><div style="padding:7px 16px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)">Haetaan kurssitietoja...</div></div>
  <div id="ticker"><div class="ticker-tag">UUTISET</div><div class="ticker-scroll"><div class="ticker-inner" id="ticker-txt">Ladataan...</div></div></div>
</div>

<div id="columns">
  <!-- METSÄTEOLLISUUS -->
  <div class="col">
    <div class="col-header">
      <div class="col-stripe" style="background:var(--forest)"></div>
      <div>
        <div class="col-title" style="color:var(--forest)">🌲 METSÄTEOLLISUUS</div>
        <div style="display:flex;align-items:center;gap:5px;margin-top:2px">
          <div class="si-dot2" id="dot-forest"></div>
          <span class="col-status" id="st-forest">Ladataan...</span>
        </div>
      </div>
      <div class="col-count" id="cnt-forest">0</div>
    </div>
    <div class="col-filter">
      <button class="cf active" data-col="forest" data-co="all">KAIKKI</button>
      <button class="cf" data-col="forest" data-co="stora enso">STORA ENSO</button>
      <button class="cf" data-col="forest" data-co="upm">UPM</button>
      <button class="cf" data-col="forest" data-co="metsä">METSÄ GROUP</button>
      <button class="cf" data-col="forest" data-co="koskinen">KOSKISEN</button>
      <button class="cf" data-col="forest" data-co="sappi">SAPPI</button>
      <button class="cf" data-col="forest" data-co="billerud">BILLERUD</button>
    </div>
    <div class="col-body" id="body-forest"></div>
  </div>

  <!-- METALLITEOLLISUUS -->
  <div class="col">
    <div class="col-header">
      <div class="col-stripe" style="background:var(--metal)"></div>
      <div>
        <div class="col-title" style="color:var(--metal)">⚙️ METALLITEOLLISUUS</div>
        <div style="display:flex;align-items:center;gap:5px;margin-top:2px">
          <div class="si-dot2" id="dot-metal"></div>
          <span class="col-status" id="st-metal">Ladataan...</span>
        </div>
      </div>
      <div class="col-count" id="cnt-metal">0</div>
    </div>
    <div class="col-filter">
      <button class="cf active" data-col="metal" data-co="all">KAIKKI</button>
      <button class="cf" data-col="metal" data-co="ssab">SSAB</button>
      <button class="cf" data-col="metal" data-co="outokumpu">OUTOKUMPU</button>
      <button class="cf" data-col="metal" data-co="metso">METSO</button>
      <button class="cf" data-col="metal" data-co="wärtsilä">WÄRTSILÄ</button>
      <button class="cf" data-col="metal" data-co="kone">KONE</button>
    </div>
    <div class="col-body" id="body-metal"></div>
  </div>

  <!-- MUUT (Yara + Rautatie + Logistiikka) -->
  <div class="col">
    <div class="col-header">
      <div class="col-stripe" style="background:var(--other)"></div>
      <div>
        <div class="col-title" style="color:var(--other)">🌾 MUUT TOIMIALAT</div>
        <div style="display:flex;align-items:center;gap:5px;margin-top:2px">
          <div class="si-dot2" id="dot-other"></div>
          <span class="col-status" id="st-other">Ladataan...</span>
        </div>
      </div>
      <div class="col-count" id="cnt-other">0</div>
    </div>
    <div class="col-filter">
      <button class="cf active" data-col="other" data-co="all">KAIKKI</button>
      <button class="cf" data-col="other" data-co="yara">YARA</button>
      <button class="cf" data-col="other" data-co="rautatie">RAUTATIE</button>
      <button class="cf" data-col="other" data-co="logistiikka">LOGISTIIKKA</button>
    </div>
    <div class="col-body" id="body-other"></div>
  </div>
</div>

<script>
// ── FEEDS ─────────────────────────────────────────────────────
// Direct Finnish RSS feeds + keywords per category
const COLS = {
  forest: {
    kw: ['stora enso','upm','metsä','metsa','koskinen','sappi','billerud','metsäliitto',
         'metsäteollisuus','paperi','sellu','kartonki','puu','timber','pulp','paper',
         'forest','wood','cellulose','kraftliner','skogsindus'],
    feeds: [
      ['https://feeds.yle.fi/uutiset/v1/majorHeadlines/YLE_UUTISET.rss','YLE'],
      ['https://www.hs.fi/rss/tuoreimmat.xml','HS'],
      ['https://www.iltalehti.fi/rss/uutiset.xml','Iltalehti'],
      ['https://www.is.fi/rss/tuoreimmat.xml','IS'],
      ['https://feeds.kauppalehti.fi/rss/main','Kauppalehti'],
      ['https://www.is.fi/taloussanomat/rss/tuoreimmat.xml','Taloussanomat'],
      ['https://www.maaseuduntulevaisuus.fi/rss.xml','Maaseudun Tulevaisuus'],
    ]
  },
  metal: {
    kw: ['ssab','outokumpu','metso','wärtsilä','wartsila','kone','teräs','stål','steel',
         'metal','outotec','ruukki','rautaruukki','metalliteollisuus','kaivos','mining'],
    feeds: [
      ['https://feeds.yle.fi/uutiset/v1/majorHeadlines/YLE_UUTISET.rss','YLE'],
      ['https://www.hs.fi/rss/tuoreimmat.xml','HS'],
      ['https://www.iltalehti.fi/rss/uutiset.xml','Iltalehti'],
      ['https://www.is.fi/rss/tuoreimmat.xml','IS'],
      ['https://feeds.kauppalehti.fi/rss/main','Kauppalehti'],
      ['https://www.is.fi/taloussanomat/rss/tuoreimmat.xml','Taloussanomat'],
    ]
  },
  other: {
    kw: ['yara','lannoite','fertilizer','rautatie','juna','vr ','logistiikka','railway',
         'freight','logistics','rail','cargo','kuljetukset','väylä','nitrogen','ammonia'],
    feeds: [
      ['https://feeds.yle.fi/uutiset/v1/majorHeadlines/YLE_UUTISET.rss','YLE'],
      ['https://www.hs.fi/rss/tuoreimmat.xml','HS'],
      ['https://www.iltalehti.fi/rss/uutiset.xml','Iltalehti'],
      ['https://www.is.fi/rss/tuoreimmat.xml','IS'],
      ['https://feeds.kauppalehti.fi/rss/main','Kauppalehti'],
      ['https://www.is.fi/taloussanomat/rss/tuoreimmat.xml','Taloussanomat'],
      ['https://www.maaseuduntulevaisuus.fi/rss.xml','Maaseudun Tulevaisuus'],
    ]
  }
};

const STOCKS = [
  {sym:'STERV.HE',name:'Stora Enso'},{sym:'UPM.HE',name:'UPM'},
  {sym:'METSB.HE',name:'Metsä Board'},{sym:'OUT1V.HE',name:'Outokumpu'},
  {sym:'METSO.HE',name:'Metso'},{sym:'WRT1V.HE',name:'Wärtsilä'},
  {sym:'KNEBV.HE',name:'Kone'},{sym:'YAR.OL',name:'Yara'},
];

// ── PROXY LIST ────────────────────────────────────────────────
// Tried in order until one works
const PROXIES = [
  { name:'allorigins',
    fetch: async (url) => {
      const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, {signal:AbortSignal.timeout(8000)});
      const d = await r.json();
      return d.contents || '';
    }
  },
  { name:'corsproxy.io',
    fetch: async (url) => {
      const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`, {signal:AbortSignal.timeout(8000)});
      return await r.text();
    }
  },
  { name:'rss2json',
    fetch: async (url) => {
      const r = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&count=40`, {signal:AbortSignal.timeout(8000)});
      const d = await r.json();
      if(d.status !== 'ok') throw new Error('rss2json failed');
      // Convert to XML-like structure by returning JSON flag
      return JSON.stringify({_rss2json:true, items:d.items});
    }
  },
];

let goodProxy = null;

// ── PARSE RSS XML ─────────────────────────────────────────────
function parseRSS(raw, src) {
  // Check if it's rss2json JSON format
  try {
    const j = JSON.parse(raw);
    if(j._rss2json && j.items) {
      return j.items.map(i => ({
        title:   clean(i.title||''),
        desc:    clean(i.description||i.content||'').slice(0,300),
        url:     i.link||'',
        date:    i.pubDate ? fmtDate(i.pubDate) : '',
        rawDate: i.pubDate||'',
        source:  src,
      }));
    }
  } catch(e) {}

  // Parse XML
  try {
    const doc = new DOMParser().parseFromString(raw, 'text/xml');
    const parseErr = doc.querySelector('parsererror');
    if(parseErr) return [];

    // RSS
    const items = [...doc.querySelectorAll('item')];
    if(items.length) {
      return items.map(el => {
        const get = (sel) => el.querySelector(sel)?.textContent?.trim() || '';
        const title = clean(get('title'));
        const link  = get('link') || get('guid');
        const date  = get('pubDate');
        const desc  = clean(get('description') || get('encoded'));
        return {title, desc:desc.slice(0,300), url:link, date:fmtDate(date), rawDate:date, source:src};
      }).filter(i=>i.title);
    }

    // Atom
    const entries = [...doc.querySelectorAll('entry')];
    return entries.map(el => {
      const get = (sel) => el.querySelector(sel)?.textContent?.trim() || '';
      const title = clean(get('title'));
      const link  = el.querySelector('link')?.getAttribute('href') || get('link');
      const date  = get('published') || get('updated');
      const desc  = clean(get('summary') || get('content'));
      return {title, desc:desc.slice(0,300), url:link, date:fmtDate(date), rawDate:date, source:src};
    }).filter(i=>i.title);
  } catch(e) { return []; }
}

// ── FETCH ONE FEED ────────────────────────────────────────────
async function fetchFeed(url, src) {
  const toTry = goodProxy
    ? [goodProxy, ...PROXIES.filter(p=>p.name!==goodProxy.name)]
    : PROXIES;

  for(const proxy of toTry) {
    try {
      const raw = await proxy.fetch(url);
      if(!raw || raw.length < 100) continue;
      const items = parseRSS(raw, src);
      if(items.length > 0) {
        goodProxy = proxy;
        console.log(`✅ [${proxy.name}] ${src}: ${items.length} items`);
        return items;
      }
    } catch(e) {
      console.warn(`❌ [${proxy.name}] ${src}: ${e.message}`);
    }
  }
  console.error(`💀 All proxies failed for ${src}`);
  return [];
}

// ── FETCH COLUMN ──────────────────────────────────────────────
const store  = {forest:[], metal:[], other:[]};
const filter = {forest:'all', metal:'all', other:'all'};

async function fetchCol(col) {
  setDot(col,'busy','Haetaan...');
  showSkel(col);

  const cfg = COLS[col];
  // Fetch all feeds in parallel
  const results = await Promise.allSettled(
    cfg.feeds.map(([u,s]) => fetchFeed(u,s))
  );
  let items = results.flatMap(r => r.status==='fulfilled' ? r.value : []);
  console.log(`[${col}] raw items: ${items.length}`);

  // Keyword filter
  const kw = cfg.kw;
  const filtered = items.filter(a => {
    const txt = (a.title+' '+a.desc).toLowerCase();
    return kw.some(k => txt.includes(k));
  });
  // Fallback: if filter is too aggressive, keep all
  items = filtered.length >= 3 ? filtered : items.slice(0,40);
  console.log(`[${col}] after filter: ${items.length}`);

  // Deduplicate by title
  const seen = new Set();
  items = items.filter(a => {
    const k = a.title.toLowerCase().replace(/\s+/g,' ').slice(0,50);
    if(seen.has(k)) return false; seen.add(k); return true;
  });

  // Sort newest first
  items.sort((a,b) => new Date(b.rawDate||0) - new Date(a.rawDate||0));

  store[col] = items;
  document.getElementById('cnt-'+col).textContent = items.length;
  setDot(col,'ok', items.length + ' art. · ' + new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'}));
  render(col);
  updateTicker();
}

// ── RENDER ────────────────────────────────────────────────────
function render(col) {
  const body = document.getElementById('body-'+col);
  let items = store[col] || [];
  const f = filter[col];
  if(f && f !== 'all') {
    items = items.filter(a => (a.title+' '+a.desc).toLowerCase().includes(f));
  }
  if(!items.length) {
    body.innerHTML = '<div style="padding:30px;text-align:center;font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--dim)">EI UUTISIA</div>';
    return;
  }
  body.innerHTML = '';
  items.forEach((a,i) => {
    const card = document.createElement('div');
    card.className = 'nc';
    card.dataset.col = col;
    card.style.animationDelay = (i*.03)+'s';
    card.innerHTML = `
      <div class="nc-top">
        <span class="nc-src" data-col="${col}">${esc(a.source)}</span>
        <span class="nc-date">${esc(a.date)}</span>
      </div>
      <div class="nc-title">${esc(a.title)}</div>
      ${a.desc ? `<div class="nc-desc">${esc(a.desc)}</div>` : ''}`;
    if(a.url) card.addEventListener('click', () => window.open(a.url,'_blank'));
    body.appendChild(card);
  });
}

// ── COMPANY FILTER ────────────────────────────────────────────
document.querySelectorAll('.cf').forEach(btn => btn.addEventListener('click', () => {
  const col = btn.dataset.col;
  document.querySelectorAll(`.cf[data-col="${col}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filter[col] = btn.dataset.co === 'all' ? 'all' : btn.dataset.co;
  render(col);
}));

// ── STOCKS ────────────────────────────────────────────────────
async function fetchStocks() {
  const strip = document.getElementById('stock-strip');
  strip.innerHTML = '';
  await Promise.all(STOCKS.map(async s => {
    const div = document.createElement('div'); div.className = 'si';
    try {
      const url = `https://query1.finance.yahoo.com/v8/finance/chart/${s.sym}?interval=1d&range=1d`;
      const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`, {signal:AbortSignal.timeout(6000)});
      const d = await r.json();
      const m = d?.chart?.result?.[0]?.meta;
      let price='–', chg=0, cur='€';
      if(m) {
        price = (m.regularMarketPrice||0).toFixed(2);
        const prev = m.chartPreviousClose||m.previousClose||0;
        chg = prev ? ((m.regularMarketPrice-prev)/prev*100) : 0;
        cur = m.currency==='EUR'?'€':m.currency||'€';
      }
      const cls = chg>0.05?'up':chg<-0.05?'down':'flat';
      const arr = chg>0.05?'▲':chg<-0.05?'▼':'—';
      div.innerHTML = `<div class="si-sym">${esc(s.sym)}</div><div class="si-name">${esc(s.name)}</div><div class="si-price">${price} ${cur}</div><div class="si-chg ${cls}">${arr} ${Math.abs(chg).toFixed(2)}%</div>`;
    } catch(e) {
      div.innerHTML = `<div class="si-sym">${esc(s.sym)}</div><div class="si-name">${esc(s.name)}</div><div class="si-price" style="color:var(--dim)">–</div><div class="si-chg flat">–</div>`;
    }
    strip.appendChild(div);
  }));
}

// ── TICKER ────────────────────────────────────────────────────
function updateTicker() {
  const all = [...store.forest, ...store.metal, ...store.other];
  if(!all.length) return;
  document.getElementById('ticker-txt').textContent =
    all.slice(0,50).map(a=>`⬥ ${a.title}`).join('    ');
}

// ── HELPERS ───────────────────────────────────────────────────
function showSkel(col) {
  document.getElementById('body-'+col).innerHTML =
    Array(5).fill(0).map((_,i)=>`<div class="skel" style="animation-delay:${i*.08}s"><div class="skel-l" style="width:30%;height:9px"></div><div class="skel-l" style="width:88%;height:13px;margin-top:8px"></div><div class="skel-l" style="width:70%;height:13px"></div><div class="skel-l" style="width:55%;height:10px;margin-top:6px"></div></div>`).join('');
}
function setDot(col,s,txt) {
  document.getElementById('dot-'+col).className='si-dot2 '+(s==='ok'?'ok':s==='busy'?'busy':'err');
  document.getElementById('st-'+col).textContent=txt;
}
function clean(h) { return h.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim(); }
function fmtDate(d) { try { const dt=new Date(d); return isNaN(dt)?'':dt.toLocaleDateString('fi-FI',{day:'2-digit',month:'2-digit',year:'numeric'}); } catch(e){return '';} }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── CLOCK ─────────────────────────────────────────────────────
let nextAt = Date.now()+36e5;
setInterval(()=>{
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('fi-FI');
  const rem=Math.max(0,Math.round((nextAt-Date.now())/1000));
  document.getElementById('next-lbl').textContent=`⟳ ${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}`;
},1000);

// ── AUTO REFRESH ──────────────────────────────────────────────
function fetchAll() {
  nextAt=Date.now()+36e5;
  ['forest','metal','other'].forEach(fetchCol);
}
setInterval(fetchAll,36e5);
setInterval(fetchStocks,9e5);

// ── INIT ──────────────────────────────────────────────────────
fetchAll();
fetchStocks();
</script>
